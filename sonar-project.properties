# =====================================================================
# Configuración de SonarQube para MANI-Landing
# Referencia: ADR-0005 (SAST en CI/CD con SonarQube)
# Servidor: SonarQube Community de la VM de Calidad (self-hosted, no SonarCloud)
# =====================================================================

# Identificación del proyecto. En pull requests el workflow quality-gate.yml
# sobrescribe la clave con mani-landing-pr (Community no analiza ramas ni PRs).
sonar.projectKey=mani-landing
sonar.projectName=MANI-Landing

sonar.sourceEncoding=UTF-8

# Rutas de código fuente y pruebas
sonar.sources=src
sonar.tests=tests
sonar.test.inclusions=tests/**/*.test.js
sonar.exclusions=src/assets/**

# Reporte de cobertura generado por "npm run test:coverage" (lcov nativo de Node)
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# La lógica (src/utils, src/config/flutterWebUrl.js) exige el umbral del gate.
# Fuera de la cobertura: componentes JSX y hook de React (capa visual sin pruebas
# unitarias), datos estáticos, y appConfig.js, que lee import.meta.env de Vite y
# no se puede importar desde node:test.
sonar.coverage.exclusions=\
  src/**/*.jsx,\
  src/hooks/**,\
  src/constants/**,\
  src/config/appConfig.js
